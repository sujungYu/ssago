    <rect x="52" y="22" width="52" height="70" rx="1.5" fill="url(#in)"/>
    <rect x="52" y="22" width="52" height="70" rx="1.5" fill="url(#mesh)"/>
    <path d="M52 22h52" stroke="#1f3d73" stroke-width="1.5" opacity=".35"/>
    <path d="M47 18h60" stroke="#fff" stroke-width="1.6" stroke-linecap="round" opacity=".55"/>
    <path d="M47 18v76" stroke="#fff" stroke-width="1.6" stroke-linecap="round" opacity=".35"/>
