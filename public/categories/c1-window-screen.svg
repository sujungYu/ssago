<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" width="160" height="120">
  <!-- c1 방충망 수리·교체: 망이 보이는 방충망 프레임 (싸고 카테고리 일러스트 공통 기준: 160x120, 왼쪽 위 조명, 깊이 +6,+4) -->
  <defs>
    <linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7aa2e3"/><stop offset="1" stop-color="#315da8"/></linearGradient>
    <linearGradient id="bd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#284d8e"/><stop offset="1" stop-color="#1f3d73"/></linearGradient>
    <linearGradient id="in" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f3f7fd"/><stop offset="1" stop-color="#d3e0f5"/></linearGradient>
    <pattern id="mesh" width="4" height="4" patternUnits="userSpaceOnUse"><path d="M0 0H4M0 0V4" stroke="#6f86ad" stroke-width=".7" opacity=".75"/></pattern>
    <filter id="s" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="2" dy="3" stdDeviation="2.5" flood-color="#1f3d73" flood-opacity=".18"/></filter>
